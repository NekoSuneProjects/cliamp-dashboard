name: PR security audit
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js for dependency remediation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh lockfiles and apply compatible npm security fixes
        id: remediate
        continue-on-error: true
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          if [ -f updater/package.json ]; then
            (cd updater && npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm audit fix --package-lock-only --ignore-scripts --no-fund || true)
          fi
          git diff --check
          git add -- package-lock.json
          if [ -f updater/package-lock.json ]; then
            git add -- updater/package-lock.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(deps): refresh npm lockfiles after security audit'
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi

      - name: Scan dependency lockfiles with OSV
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.1
        with:
          scan-args: |-
            scan
            --recursive
            --format=json
            --output=osv-results.json
            ./

      - name: Scan current source for secrets (standalone OSS Gitleaks)
        id: gitleaks
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir --no-banner --redact --report-format json --report-path gitleaks-results.json --exit-code 1 .

      - name: Build actionable PR report
        if: always()
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          REMEDIATE_OUTCOME: ${{ steps.remediate.outcome }}
          AUDIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          AUDIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/security_report.py

      - name: Upload safe audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-summary
          path: |
            security-comment.md
            osv-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Post PR security result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file security-comment.md

      - name: Fail for scan findings or errors
        if: ${{ always() && (steps.remediate.outcome != 'success' || steps.osv.outcome != 'success' || steps.gitleaks.outcome != 'success') }}
        run: exit 1
