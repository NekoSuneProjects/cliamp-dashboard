name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - server.js
      - radio-worker.js
      - station-metadata.js
      - stream-destinations.js
      - radio-layout.js
      - radio-artwork.js
      - radio-placeholder.js
      - public/**
      - .github/workflows/docker-publish.yml

permissions:
  contents: read

concurrency:
  group: cliamp-docker-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish multi-platform Docker image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NekoSuneProjects/cliamp-dashboard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nekosuneprojects/cliamp-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build and push only from main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
