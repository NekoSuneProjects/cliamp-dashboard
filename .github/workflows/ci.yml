name: CI
on:
  push:
    branches: [main, feature/radio-rtmp-restream]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check radio-worker.js
      - run: npm test
      - run: docker build -t cliamp-rtmp-ci .
