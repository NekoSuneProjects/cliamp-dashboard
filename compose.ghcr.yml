# Production deployment: pulls the prebuilt image from GitHub Container Registry.
# GitHub Actions publishes this image only after a push to main.
services:
  cliamp-dashboard:
    image: ghcr.io/nekosuneprojects/cliamp-dashboard:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      PORT: "8096"
      DATA_DIR: /data
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in .env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
      CLIAMP_BASE_URL: ${CLIAMP_BASE_URL:?Set CLIAMP_BASE_URL in .env}
    volumes:
      - ./data:/data
